name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Permet d'exécuter le workflow manuellement

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🔧 Installer PHP et ses extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, pdo, bcmath
          tools: composer:v2

      - name: ⚡ Mettre à jour Composer
        run: composer self-update

      - name: 📦 Installer les dépendances
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: 🗄️ Copier le fichier .env
        run: cp .env.example .env

      - name: 🔑 Générer la clé d'application
        run: php artisan key:generate

      - name: 🏗️ Exécuter les migrations
        run: php artisan migrate --force

      - name: 🚀 Lancer les tests avec PHPUnit
        run: vendor/bin/phpunit --testdox
