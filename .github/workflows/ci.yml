    stages:
      - checkout
      - build
      - unit_tests
      - ui_tests
      - code_quality
      - package
      - docker_build
      - deploy_artifact
      - docker_push
      - provision
      - deploy
    
    variables:
      DOCKER_DRIVER: overlay2
    
    # 1. Récupération du code source depuis GitLab
    checkout:
      stage: checkout
      script:
        - git clone https://gitlab.com/https://github.com/Bousso-Diouf/Bousso-Diouf
    
    # 2. Build du projet (Installation des dépendances PHP)
    build:
      stage: build
      script:
        - apt-get update && apt-get install -y git unzip curl
        - curl -sS https://getcomposer.org/installer | php
        - php composer.phar install --no-dev --prefer-dist
    
    # 3. Exécution des tests unitaires (Tests PHPUnit)
    unit_tests:
      stage: unit_tests
      script:
        - vendor/bin/phpunit --config phpunit.xml
    
    # 4. Exécution des tests IHM (Exemple avec Cypress)
    ui_tests:
      stage: ui_tests
      script:
        - npm install
        - npm run cypress:run
    
    # 5. Vérification de la qualité du code (SonarQube, PHPStan, etc.)
    code_quality:
      stage: code_quality
      script:
        - vendor/bin/phpstan analyse --level=max src/
    
    # 6. Packaging de l'artéfact (Générer le paquet Laravel)
    package:
      stage: package
      script:
        - php artisan config:cache
        - php artisan route:cache
        - php artisan view:cache
    
    # 7. Création d'une image Docker pour le projet
    docker_build:
      stage: docker_build
      script:
        - docker build -t myapp:$CI_COMMIT_SHA .
    
    # 8. Dépôt de l'artefact dans un repository local pour Dev et Staging
    deploy_artifact_dev_staging:
      stage: deploy_artifact
      only:
        - dev
        - staging
      script:
        - mvn deploy -DrepositoryId=local-repository -Durl=http://local-repository-url
    
    # 9. Push de l'image Docker dans un registry (local pour Dev/Staging, distant pour Préprod/Prod)
    docker_push:
      stage: docker_push
      script:
        - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        - docker push $CI_REGISTRY/myapp:$CI_COMMIT_SHA
    
    # 10. Provisioning automatique de l'environnement cible
    provision:
      stage: provision
      script:
        - terraform init
        - terraform apply -auto-approve
    
    # 11. Déploiement automatique des microservices dans l'environnement cible (Kubernetes, Docker Compose, etc.)
    deploy:
      stage: deploy
      script:
        - kubectl apply -f k8s/deployment.yaml
      only:
        - master
        - staging
